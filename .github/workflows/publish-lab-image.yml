name: Publish lab image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish the lab image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          metadata="$RUNNER_TEMP/lab-image.json"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker buildx build --platform linux/amd64 --push \
            --build-arg "RELEASE_VERSION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --metadata-file "$metadata" --tag "$image:$GITHUB_SHA" .
          digest="$(jq -er '."containerimage.digest"' "$metadata")"
          printf 'Image reference: `%s@%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
