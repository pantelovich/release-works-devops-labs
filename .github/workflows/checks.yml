name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-rehearsal:
    name: Code and local release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install ruff==0.17.5 pip-audit==2.10.1
      - name: Block known vulnerable runtime dependencies
        run: python -m pip_audit --disable-pip --require-hashes --strict --progress-spinner off -r requirements.txt
      - name: Check lint, formatting and documentation
        run: |
          ruff check .
          ruff format --check .
          python scripts/check_docs.py
          bash -n scripts/rehearse-local.sh
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Test release and rollback
        run: bash scripts/rehearse-local.sh

  cloud-templates:
    name: Cloud templates without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.11.2'
          terraform_wrapper: false
      - name: Validate AWS Terraform and its provider lock
        run: |
          terraform -chdir=infra/aws fmt -check -recursive
          terraform -chdir=infra/aws init -backend=false -lockfile=readonly
          terraform -chdir=infra/aws validate
      - name: Compile Azure Bicep
        run: |
          bin="$RUNNER_TEMP/bicep"
          curl --fail --silent --show-error --location \
            https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64 \
            --output "$bin"
          echo "b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e  $bin" | sha256sum --check
          chmod +x "$bin"
          "$bin" build infra/azure/main.bicep --outfile "$RUNNER_TEMP/azure-lab.json"
